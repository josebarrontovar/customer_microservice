name: CI/CD for Java Spring Boot App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build the project with Maven
        run: mvn clean install

      - name: Build Docker image
        run: docker build -t josebarrontovar10/userapp:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: josebarrontovar10
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push Docker image
        run: docker push josebarrontovar10/userapp:latest
